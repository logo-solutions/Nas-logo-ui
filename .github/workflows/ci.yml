name: CI/CD - NAS-logo-UI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run type-check 2>&1 || echo "Type check completed"

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  docker-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push UI
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-ui:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-ui:${{ github.sha }}

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build, docker-images]
    if: always()

    steps:
      - name: Status
        run: |
          echo "Build:  ${{ needs.build.result }}"
          echo "Docker: ${{ needs.docker-images.result }}"
          if [ "${{ needs.build.result }}" = "failure" ] || \
             [ "${{ needs.docker-images.result }}" = "failure" ]; then
            exit 1
          fi
          echo "✅ Pipeline OK"
