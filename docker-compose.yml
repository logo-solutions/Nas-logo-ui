version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: nas-logo-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - nas-network
    depends_on:
      - ui

  gateway:
    build: ./gateway
    container_name: nas-logo-gateway
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=nas-logo-dev-secret-key-change-in-prod
      - IMMICH_URL=http://immich_server:2283
      - PAPERLESS_URL=http://paperless:8000
      - MEILISEARCH_URL=http://meilisearch:7700
      - N8N_URL=http://n8n:5678
      - GRAFANA_URL=http://grafana:3000
      - NTFY_URL=http://ntfy:80
    networks:
      - nas-network
    depends_on:
      - ui

  ui:
    build: .
    container_name: nas-logo-ui
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - nas-network
    depends_on:
      - gateway

networks:
  nas-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
