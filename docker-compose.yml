version: '3.8'

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: nas-logo-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "2019:2019"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - nas-network
    depends_on:
      ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  gateway:
    build: ./gateway
    container_name: nas-logo-gateway
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - IMMICH_URL=${IMMICH_URL}
      - PAPERLESS_URL=${PAPERLESS_URL}
      - MEILISEARCH_URL=${MEILISEARCH_URL}
      - N8N_URL=${N8N_URL}
      - GRAFANA_URL=${GRAFANA_URL}
      - NTFY_URL=${NTFY_URL}
    networks:
      - nas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ui:
    build: .
    container_name: nas-logo-ui
    ports:
      - "8088:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-http://localhost:8000}
    networks:
      - nas-network
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  nas-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
