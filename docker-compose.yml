version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: nas-logo-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - nas-network
    depends_on:
      - ui

  gateway:
    build: ./gateway
    container_name: nas-logo-gateway
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=nas-logo-dev-secret-key-change-in-prod
      - IMMICH_API_KEY=dg46m83TgQBP4r8pxPloTnagaNUl2wWcgmNlB7Wk
      - IMMICH_URL=http://100.113.214.55:2283
      - PAPERLESS_URL=http://100.113.214.55:8010
      - MEILISEARCH_URL=http://100.113.214.55:7700
      - N8N_URL=http://100.113.214.55:5679
      - GRAFANA_URL=http://100.113.214.55:3000
      - NTFY_URL=http://100.113.214.55:80
    networks:
      - nas-network

  ui:
    build: .
    container_name: nas-logo-ui
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - nas-network
    depends_on:
      - gateway

networks:
  nas-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
